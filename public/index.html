<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Localhost — a tiny Medium on your laptop</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <div class="header-inner">
      <a class="logo" href="/">Localhost</a>
      <nav id="auth-area"></nav>
    </div>
  </header>

  <main class="container">
    <div id="feed"></div>
  </main>

  <script src="/app.js"></script>
  <script>
    (async () => {
      const feed = document.getElementById('feed');
      try {
        const posts = await api('/api/posts');
        feed.innerHTML = posts.length
          ? posts.map(postCard).join('')
          : '<p class="empty">No posts yet. <a href="/write.html">Write the first one.</a></p>';
      } catch (e) {
        feed.innerHTML = `<p class="error">${escapeHtml(e.message)}</p>`;
      }
    })();
  </script>
</body>
</html>
